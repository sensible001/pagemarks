name: Backup

on:
  schedule:
    - cron: "47 6 * * *"   # every day: 06:47 UTC = 1:47 AM EST / 2:47 AM EDT, before the link check
  workflow_dispatch:        # adds a "Run workflow" button to back up right now

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm install --no-save --no-audit --no-fund firebase-admin@14
      - name: Back up every library
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node checker/backup.mjs
