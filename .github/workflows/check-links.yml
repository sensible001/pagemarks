name: Check links

on:
  schedule:
    - cron: "17 7 * * *"   # every night, about 2–3 AM New York time
  workflow_dispatch:        # adds a "Run workflow" button for checking on demand

permissions:
  contents: read

concurrency:
  group: check-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-save --no-audit --no-fund firebase-admin@14
      - name: Check every Pagemark
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node checker/check-links.mjs
